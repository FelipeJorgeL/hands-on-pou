<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Machado | Destinos dos Sonhos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/assets/css/styleArthur.css">
</head>
<body id="corpo-pagina">
    
    <header id="cabecalho-principal">
        <h1 class="titulo-principal">Arthur Machado</h1>
        <p class="subtitulo-principal">Galeria de Destinos dos Sonhos</p>
    </header>

    <main id="conteudo-principal">
        <section id="galeria-destinos" name="secao-galeria" class="container-galeria">
            
            <div class="grade-destinos">
                
                <article class="cartao-destino" name="cartao-toquio">
                    <img src="/assets/img/toquio.jpg" alt="Paisagem urbana de Tóquio" class="imagem-destino">
                    <div class="informacoes-destino">
                        <h2 class="titulo-destino">Tóquio</h2>
                        <a class="botao-explorar" name="botao-toquio" href="https://pt.wikipedia.org/wiki/T%C3%B3quio">Explorar</a>
                    </div>
                </article>

                <article class="cartao-destino" name="cartao-barcelona">
                    <img src="/assets/img/barcelona.jpg" alt="Arquitetura de Barcelona" class="imagem-destino">
                    <div class="informacoes-destino">
                        <h2 class="titulo-destino">Barcelona</h2>
                        <a class="botao-explorar" name="botao-barcelona" href="https://pt.wikipedia.org/wiki/Barcelona">Explorar</a>
                    </div>
                </article>

                <article class="cartao-destino" name="cartao-los-angeles">
                    <img src="/assets/img/LA.png" alt="Visão de Los Angeles" class="imagem-destino">
                    <div class="informacoes-destino">
                        <h2 class="titulo-destino">Los Angeles</h2>
                        <a class="botao-explorar" name="botao-los-angeles" href="https://pt.wikipedia.org/wiki/Los_Angeles">Explorar</a>
                    </div>
                </article>

                <article class="cartao-destino" name="cartao-machu-picchu">
                    <img src="/assets/img/machu-picchu.jpg" alt="Ruínas de Machu Picchu" class="imagem-destino">
                    <div class="informacoes-destino">
                        <h2 class="titulo-destino">Machu Picchu</h2>
                        <a class="botao-explorar" name="botao-machu-picchu" href="https://pt.wikipedia.org/wiki/Machu_Picchu">Explorar</a>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <footer id="rodape-principal">
        <p class="texto-rodape">&copy; 2026 Arthur Machado. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
